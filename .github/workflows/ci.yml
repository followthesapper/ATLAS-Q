name: CI

on:
  push:
    branches: [ ATLAS-Q, Dev ]
  pull_request:
    branches: [ ATLAS-Q, Dev ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install torch>=2.0.0 --index-url https://download.pytorch.org/whl/cpu
        pip install -e .[dev]
        pip install pyscf  # For molecular Hamiltonian tests

    - name: Lint with ruff
      run: |
        ruff check src/ --output-format=github --select I

    - name: Test core functionality (CRITICAL)
      run: |
        python -c "
        from atlas_q import get_quantum_sim
        print('Testing core quantum simulation...')
        QCH, _, _, _ = get_quantum_sim()
        sim = QCH()
        factors = sim.factor_number(15)
        assert set(factors) == {3, 5}, f'Expected [3,5], got {factors}'
        print('Core factorization test: PASS')
        "

    - name: Test MPS functionality
      run: |
        python -c "
        from atlas_q.adaptive_mps import AdaptiveMPS
        import torch
        print('Testing MPS with 5 qubits...')
        mps = AdaptiveMPS(5, bond_dim=4, device='cpu')
        H = torch.tensor([[1,1],[1,-1]], dtype=torch.complex64)/torch.sqrt(torch.tensor(2.0))
        mps.apply_single_qubit_gate(0, H)
        print('MPS test: PASS')
        "


  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip build

    - name: Build package
      run: |
        python -m build

    - name: Check package metadata
      run: |
        python -m pip install twine
        twine check dist/*

    - name: Generate SBOM
      run: |
        pip install cyclonedx-bom
        cyclonedx-py requirements <(echo "numpy>=1.22
        scipy>=1.10.0
        matplotlib>=3.6
        torch>=2.0.0
        triton>=2.0.0") --pyproject pyproject.toml --of JSON -o sbom.json

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: dist/

    - name: Upload SBOM
      uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.json
