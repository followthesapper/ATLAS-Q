name: CI

on:
  push:
    branches: [ ATLAS-Q ]
  pull_request:
    branches: [ ATLAS-Q ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install torch>=2.0.0 --index-url https://download.pytorch.org/whl/cpu
        pip install -e .[dev]
        pip install pyscf  # For molecular Hamiltonian tests

    - name: Lint with ruff
      run: |
        ruff check src/ --output-format=github
      continue-on-error: true

    - name: Check formatting with black
      run: |
        black --check src/
      continue-on-error: true

    - name: Run integration tests
      run: |
        pytest tests/integration/ -v --maxfail=3
      continue-on-error: true

    - name: Run legacy tests
      run: |
        pytest tests/legacy/ -v --maxfail=5
      continue-on-error: true

    - name: Test package imports
      run: |
        python -c "from atlas_q import get_quantum_sim; print('✅ Package imports working')"
        python -c "from atlas_q.adaptive_mps import AdaptiveMPS; print('✅ MPS imports working')"

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip build

    - name: Build package
      run: |
        python -m build

    - name: Check package metadata
      run: |
        python -m pip install twine
        twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-package
        path: dist/
