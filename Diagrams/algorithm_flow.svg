<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f56565;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c53030;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2f855a;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#e53e3e" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#38a169" />
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Title -->
  <rect x="50" y="20" width="1300" height="70" fill="#1a202c" rx="10"/>
  <text x="700" y="60" font-size="32" font-weight="bold" text-anchor="middle" fill="#fbbf24">
    ⚡ ALGORITHMIC FLOW: Traditional vs. Our Hybrid System
  </text>
  
  <!-- Left Side: Traditional -->
  <g id="traditional-flow">
    <rect x="50" y="110" width="600" height="60" fill="url(#redGrad)" rx="8"/>
    <text x="350" y="145" font-size="24" font-weight="bold" text-anchor="middle" fill="white">
      ❌ Traditional Simulator
    </text>
    
    <!-- Step 1 -->
    <rect x="100" y="200" width="500" height="80" fill="#fff5f5" stroke="#fc8181" stroke-width="3" rx="8"/>
    <text x="350" y="230" font-size="16" font-weight="bold" text-anchor="middle" fill="#c53030">
      1. Allocate Statevector
    </text>
    <text x="350" y="255" font-size="13" text-anchor="middle" fill="#742a2a">
      Memory: 2ⁿ × 16 bytes
    </text>
    <text x="350" y="275" font-size="12" font-style="italic" text-anchor="middle" fill="#e53e3e">
      (30 qubits = 16 GB!)
    </text>
    
    <!-- Arrow -->
    <path d="M 350 280 L 350 310" stroke="#e53e3e" stroke-width="3" marker-end="url(#arrowRed)"/>
    
    <!-- Step 2 -->
    <rect x="100" y="310" width="500" height="80" fill="#fff5f5" stroke="#fc8181" stroke-width="3" rx="8"/>
    <text x="350" y="340" font-size="16" font-weight="bold" text-anchor="middle" fill="#c53030">
      2. Apply Quantum Gates
    </text>
    <text x="350" y="365" font-size="13" text-anchor="middle" fill="#742a2a">
      Update all 2ⁿ amplitudes
    </text>
    <text x="350" y="385" font-size="12" font-style="italic" text-anchor="middle" fill="#e53e3e">
      (Matrix-vector products)
    </text>
    
    <!-- Arrow -->
    <path d="M 350 390 L 350 420" stroke="#e53e3e" stroke-width="3" marker-end="url(#arrowRed)"/>
    
    <!-- Step 3 -->
    <rect x="100" y="420" width="500" height="80" fill="#fff5f5" stroke="#fc8181" stroke-width="3" rx="8"/>
    <text x="350" y="450" font-size="16" font-weight="bold" text-anchor="middle" fill="#c53030">
      3. Apply Full FFT for QFT
    </text>
    <text x="350" y="475" font-size="13" text-anchor="middle" fill="#742a2a">
      O(2ⁿ × n) operations
    </text>
    <text x="350" y="495" font-size="12" font-style="italic" text-anchor="middle" fill="#e53e3e">
      (20 qubits = 15 ms)
    </text>
    
    <!-- Arrow -->
    <path d="M 350 500 L 350 530" stroke="#e53e3e" stroke-width="3" marker-end="url(#arrowRed)"/>
    
    <!-- Step 4 -->
    <rect x="100" y="530" width="500" height="80" fill="#fff5f5" stroke="#fc8181" stroke-width="3" rx="8"/>
    <text x="350" y="560" font-size="16" font-weight="bold" text-anchor="middle" fill="#c53030">
      4. Rejection Sampling
    </text>
    <text x="350" y="585" font-size="13" text-anchor="middle" fill="#742a2a">
      Try random states until valid
    </text>
    <text x="350" y="605" font-size="12" font-style="italic" text-anchor="middle" fill="#e53e3e">
      (Often inaccurate)
    </text>
    
    <!-- Arrow -->
    <path d="M 350 610 L 350 640" stroke="#e53e3e" stroke-width="3" marker-end="url(#arrowRed)"/>
    
    <!-- Step 5 -->
    <rect x="100" y="640" width="500" height="80" fill="#fff5f5" stroke="#fc8181" stroke-width="3" rx="8"/>
    <text x="350" y="670" font-size="16" font-weight="bold" text-anchor="middle" fill="#c53030">
      5. Classical Period-Finding
    </text>
    <text x="350" y="695" font-size="13" text-anchor="middle" fill="#742a2a">
      Check O(r) candidates sequentially
    </text>
    <text x="350" y="715" font-size="12" font-style="italic" text-anchor="middle" fill="#e53e3e">
      (Linear in period size)
    </text>
    
    <!-- Result Box -->
    <rect x="100" y="750" width="500" height="100" fill="#feb2b2" stroke="#e53e3e" stroke-width="3" rx="8"/>
    <text x="350" y="785" font-size="18" font-weight="bold" text-anchor="middle" fill="#742a2a">
      RESULT: Slow &amp; Limited
    </text>
    <text x="350" y="810" font-size="14" text-anchor="middle" fill="#742a2a">
      ⏱️ Total time: seconds to minutes
    </text>
    <text x="350" y="835" font-size="14" text-anchor="middle" fill="#742a2a">
      💾 Memory wall at ~30 qubits
    </text>
  </g>
  
  <!-- Right Side: Our System -->
  <g id="our-flow">
    <rect x="750" y="110" width="600" height="60" fill="url(#greenGrad)" rx="8"/>
    <text x="1050" y="145" font-size="24" font-weight="bold" text-anchor="middle" fill="white">
      ✅ Our Hybrid System
    </text>
    
    <!-- Step 1 -->
    <rect x="800" y="200" width="500" height="80" fill="#f0fff4" stroke="#68d391" stroke-width="3" rx="8"/>
    <text x="1050" y="230" font-size="16" font-weight="bold" text-anchor="middle" fill="#22543d">
      1. Create Compressed State
    </text>
    <text x="1050" y="255" font-size="13" text-anchor="middle" fill="#276749">
      Memory: O(1) = 32 bytes
    </text>
    <text x="1050" y="275" font-size="12" font-weight="bold" text-anchor="middle" fill="#38a169">
      ✓ (100 qubits = 32 bytes!)
    </text>
    
    <!-- Arrow with label -->
    <path d="M 1050 280 L 1050 310" stroke="#38a169" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="1120" y="300" font-size="12" fill="#38a169">10⁶⁰× better!</text>
    
    <!-- Step 2 -->
    <rect x="800" y="310" width="500" height="80" fill="#f0fff4" stroke="#68d391" stroke-width="3" rx="8"/>
    <text x="1050" y="340" font-size="16" font-weight="bold" text-anchor="middle" fill="#22543d">
      2. Implicit Gate Operations
    </text>
    <text x="1050" y="365" font-size="13" text-anchor="middle" fill="#276749">
      No explicit amplitude updates
    </text>
    <text x="1050" y="385" font-size="12" font-weight="bold" text-anchor="middle" fill="#38a169">
      ✓ (Structure preserved)
    </text>
    
    <!-- Arrow -->
    <path d="M 1050 390 L 1050 420" stroke="#38a169" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="1120" y="410" font-size="12" fill="#38a169">O(1) time!</text>
    
    <!-- Step 3 -->
    <rect x="800" y="420" width="500" height="80" fill="#f0fff4" stroke="#68d391" stroke-width="3" rx="8" filter="url(#glow)"/>
    <text x="1050" y="450" font-size="16" font-weight="bold" text-anchor="middle" fill="#22543d">
      3. Analytic QFT Sampling
    </text>
    <text x="1050" y="475" font-size="13" text-anchor="middle" fill="#276749">
      O(1) per sample - no FFT!
    </text>
    <text x="1050" y="495" font-size="12" font-weight="bold" text-anchor="middle" fill="#38a169">
      ✓ (20 qubits = 0.001 ms)
    </text>
    
    <!-- Arrow with emphasis -->
    <path d="M 1050 500 L 1050 530" stroke="#38a169" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="1120" y="520" font-size="12" font-weight="bold" fill="#38a169">15,000× faster!</text>
    
    <!-- Step 4 -->
    <rect x="800" y="530" width="500" height="80" fill="#f0fff4" stroke="#68d391" stroke-width="3" rx="8"/>
    <text x="1050" y="560" font-size="16" font-weight="bold" text-anchor="middle" fill="#22543d">
      4. Sweep Sampling (MPS)
    </text>
    <text x="1050" y="585" font-size="13" text-anchor="middle" fill="#276749">
      Canonical form + conditional probs
    </text>
    <text x="1050" y="605" font-size="12" font-weight="bold" text-anchor="middle" fill="#38a169">
      ✓ (Exact probabilities)
    </text>
    
    <!-- Arrow -->
    <path d="M 1050 610 L 1050 640" stroke="#38a169" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="1120" y="630" font-size="12" fill="#38a169">Accurate!</text>
    
    <!-- Step 5 -->
    <rect x="800" y="640" width="500" height="80" fill="#f0fff4" stroke="#68d391" stroke-width="3" rx="8"/>
    <text x="1050" y="670" font-size="16" font-weight="bold" text-anchor="middle" fill="#22543d">
      5. GPU Period-Finding
    </text>
    <text x="1050" y="695" font-size="13" text-anchor="middle" fill="#276749">
      O(√r) with GPU parallel batching
    </text>
    <text x="1050" y="715" font-size="12" font-weight="bold" text-anchor="middle" fill="#38a169">
      ✓ (10-100× speedup)
    </text>
    
    <!-- Result Box -->
    <rect x="800" y="750" width="500" height="100" fill="#c6f6d5" stroke="#38a169" stroke-width="3" rx="8"/>
    <text x="1050" y="785" font-size="18" font-weight="bold" text-anchor="middle" fill="#22543d">
      RESULT: Fast &amp; Scalable
    </text>
    <text x="1050" y="810" font-size="14" text-anchor="middle" fill="#276749">
      ⚡ Total time: milliseconds
    </text>
    <text x="1050" y="835" font-size="14" text-anchor="middle" fill="#276749">
      🚀 Scales to 100+ qubits
    </text>
  </g>
  
  <!-- Central comparison arrows -->
  <g id="comparison">
    <path d="M 650 240 L 750 240" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrowGray)"/>
    <circle cx="700" cy="240" r="25" fill="#fbbf24"/>
    <text x="700" y="248" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">VS</text>
    
    <path d="M 650 350 L 750 350" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrowGray)"/>
    <circle cx="700" cy="350" r="25" fill="#fbbf24"/>
    <text x="700" y="358" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">VS</text>
    
    <path d="M 650 460 L 750 460" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrowGray)"/>
    <circle cx="700" cy="460" r="25" fill="#fbbf24"/>
    <text x="700" y="468" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">VS</text>
    
    <path d="M 650 570 L 750 570" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrowGray)"/>
    <circle cx="700" cy="570" r="25" fill="#fbbf24"/>
    <text x="700" y="578" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">VS</text>
    
    <path d="M 650 680 L 750 680" stroke="#cbd5e0" stroke-width="2" marker-end="url(#arrowGray)"/>
    <circle cx="700" cy="680" r="25" fill="#fbbf24"/>
    <text x="700" y="688" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a202c">VS</text>
  </g>
  
  <defs>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#cbd5e0" />
    </marker>
  </defs>
</svg>