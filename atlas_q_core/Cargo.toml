[package]
name = "atlas_q_core"
version = "0.7.0"
edition = "2021"
authors = ["ATLAS-Q Contributors"]
description = "High-performance Rust core for ATLAS-Q quantum simulator"
license = "MIT"

[lib]
name = "atlas_q_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"

# Linear algebra
ndarray = "0.16"
num-complex = "0.4"

# Random number generation
rand = "0.8"

# Parallel processing
rayon = "1.10"

# Bit manipulation for stabilizer
bitvec = "1.0"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
