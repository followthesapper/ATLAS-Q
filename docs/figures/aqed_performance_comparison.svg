<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="700" y="50" font-size="36" font-weight="bold" text-anchor="middle" fill="#1f2937">
    AQED Performance Benchmark Results
  </text>
  <text x="700" y="85" font-size="18" text-anchor="middle" fill="#6b7280">
    Tests 1-6: Comprehensive Performance Evaluation
  </text>

  <!-- Background grid -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="150" y1="150" x2="150" y2="650"/>
    <line x1="150" y1="650" x2="1300" y2="650"/>
    <!-- Horizontal grid lines -->
    <line x1="150" y1="550" x2="1300" y2="550" stroke-dasharray="5,5" opacity="0.5"/>
    <line x1="150" y1="450" x2="1300" y2="450" stroke-dasharray="5,5" opacity="0.5"/>
    <line x1="150" y1="350" x2="1300" y2="350" stroke-dasharray="5,5" opacity="0.5"/>
    <line x1="150" y1="250" x2="1300" y2="250" stroke-dasharray="5,5" opacity="0.5"/>
    <line x1="150" y1="150" x2="1300" y2="150" stroke-dasharray="5,5" opacity="0.5"/>
  </g>

  <!-- Y-axis label -->
  <text x="50" y="400" font-size="18" font-weight="bold" text-anchor="middle" fill="#374151" transform="rotate(-90, 50, 400)">
    Tokens per Second (thousands)
  </text>

  <!-- Y-axis values -->
  <text x="140" y="655" font-size="14" text-anchor="end" fill="#6b7280">0</text>
  <text x="140" y="555" font-size="14" text-anchor="end" fill="#6b7280">50k</text>
  <text x="140" y="455" font-size="14" text-anchor="end" fill="#6b7280">100k</text>
  <text x="140" y="355" font-size="14" text-anchor="end" fill="#6b7280">150k</text>
  <text x="140" y="255" font-size="14" text-anchor="end" fill="#6b7280">200k</text>
  <text x="140" y="155" font-size="14" text-anchor="end" fill="#6b7280">250k</text>

  <!-- Test 1: Baseline (no optimization) -->
  <g transform="translate(200, 0)">
    <rect x="0" y="618" width="80" height="32" fill="url(#barGrad1)" stroke="#991b1b" stroke-width="2" rx="3" filter="url(#shadow)"/>
    <text x="40" y="605" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">Test 1</text>
    <text x="40" y="685" font-size="11" text-anchor="middle" fill="#6b7280">Baseline</text>
    <text x="40" y="700" font-size="11" text-anchor="middle" fill="#6b7280">(no opt)</text>
    <text x="40" y="638" font-size="13" font-weight="bold" text-anchor="middle" fill="white">34k</text>
  </g>

  <!-- Test 2: Baseline (optimized) -->
  <g transform="translate(350, 0)">
    <rect x="0" y="603" width="80" height="47" fill="url(#barGrad1)" stroke="#991b1b" stroke-width="2" rx="3" filter="url(#shadow)"/>
    <text x="40" y="590" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">Test 2</text>
    <text x="40" y="685" font-size="11" text-anchor="middle" fill="#6b7280">Baseline</text>
    <text x="40" y="700" font-size="11" text-anchor="middle" fill="#6b7280">(optimized)</text>
    <text x="40" y="630" font-size="13" font-weight="bold" text-anchor="middle" fill="white">49k</text>
  </g>

  <!-- Test 3: AQED v1 (no optimization) -->
  <g transform="translate(500, 0)">
    <rect x="0" y="361" width="80" height="289" fill="url(#barGrad2)" stroke="#065f46" stroke-width="2" rx="3" filter="url(#shadow)"/>
    <text x="40" y="348" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">Test 3</text>
    <text x="40" y="685" font-size="11" text-anchor="middle" fill="#6b7280">AQED v1</text>
    <text x="40" y="700" font-size="11" text-anchor="middle" fill="#6b7280">(no opt)</text>
    <text x="40" y="500" font-size="13" font-weight="bold" text-anchor="middle" fill="white">145k</text>
    <text x="40" y="330" font-size="12" font-weight="bold" text-anchor="middle" fill="#10b981">+3.0×</text>
  </g>

  <!-- Test 4: AQED v1 (optimized) ⭐ WINNER -->
  <g transform="translate(650, 0)">
    <rect x="0" y="228" width="80" height="422" fill="url(#barGrad2)" stroke="#065f46" stroke-width="3" rx="3" filter="url(#shadow)"/>
    <text x="40" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">Test 4</text>
    <text x="40" y="685" font-size="11" text-anchor="middle" fill="#6b7280">AQED v1</text>
    <text x="40" y="700" font-size="11" text-anchor="middle" fill="#6b7280">(optimized)</text>
    <text x="40" y="430" font-size="14" font-weight="bold" text-anchor="middle" fill="white">211k</text>
    <text x="40" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">⭐ +6.18×</text>

    <!-- Winner badge -->
    <circle cx="40" cy="180" r="25" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="40" y="188" font-size="20" text-anchor="middle">🏆</text>
  </g>

  <!-- Test 5: AQED LowRank (no optimization) -->
  <g transform="translate(800, 0)">
    <rect x="0" y="453" width="80" height="197" fill="#fde68a" stroke="#d97706" stroke-width="2" rx="3" filter="url(#shadow)"/>
    <text x="40" y="440" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">Test 5</text>
    <text x="40" y="685" font-size="11" text-anchor="middle" fill="#6b7280">LowRank</text>
    <text x="40" y="700" font-size="11" text-anchor="middle" fill="#6b7280">(no opt)</text>
    <text x="40" y="555" font-size="13" font-weight="bold" text-anchor="middle" fill="#78350f">99k</text>
  </g>

  <!-- Test 6: AQED LowRank (optimized) -->
  <g transform="translate(950, 0)">
    <rect x="0" y="424" width="80" height="226" fill="#fde68a" stroke="#d97706" stroke-width="2" rx="3" filter="url(#shadow)"/>
    <text x="40" y="411" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">Test 6</text>
    <text x="40" y="685" font-size="11" text-anchor="middle" fill="#6b7280">LowRank</text>
    <text x="40" y="700" font-size="11" text-anchor="middle" fill="#6b7280">(optimized)</text>
    <text x="40" y="540" font-size="13" font-weight="bold" text-anchor="middle" fill="#78350f">113k</text>
  </g>

  <!-- X-axis label -->
  <text x="700" y="750" font-size="18" font-weight="bold" text-anchor="middle" fill="#374151">
    Test Configuration (L=4096, Batch=8)
  </text>

  <!-- Performance Summary Box -->
  <g transform="translate(100, 780)">
    <rect x="0" y="0" width="1200" height="100" fill="#f9fafb" stroke="#d1d5db" stroke-width="2" rx="8"/>
    <text x="600" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">Key Findings</text>

    <g transform="translate(50, 45)">
      <circle cx="0" cy="0" r="5" fill="#10b981"/>
      <text x="15" y="5" font-size="14" fill="#374151">
        <tspan font-weight="bold" fill="#10b981">AQED v1 (optimized)</tspan> achieves <tspan font-weight="bold">6.18× speedup</tspan> over baseline
      </text>
    </g>

    <g transform="translate(50, 70)">
      <circle cx="0" cy="0" r="5" fill="#ef4444"/>
      <text x="15" y="5" font-size="14" fill="#374151">
        LowRank variant shows architectural bottlenecks: 101 kernels/step, 10-50% GPU utilization
      </text>
    </g>
  </g>

  <!-- L=8192 Comparison (inset) -->
  <g transform="translate(1050, 150)">
    <rect x="0" y="0" width="280" height="200" fill="white" stroke="#9ca3af" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <text x="140" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2937">L=8192 Results</text>

    <!-- Mini bars -->
    <g transform="translate(40, 50)">
      <text x="0" y="0" font-size="11" fill="#6b7280">Baseline:</text>
      <rect x="0" y="5" width="38" height="15" fill="#fca5a5" rx="2"/>
      <text x="45" y="17" font-size="11" font-weight="bold" fill="#991b1b">19k</text>
    </g>

    <g transform="translate(40, 85)">
      <text x="0" y="0" font-size="11" fill="#6b7280">AQED v1:</text>
      <rect x="0" y="5" width="197" height="15" fill="#6ee7b7" rx="2"/>
      <text x="205" y="17" font-size="11" font-weight="bold" fill="#065f46">197k</text>
    </g>

    <g transform="translate(40, 115)">
      <rect x="0" y="0" width="200" height="50" fill="#ecfdf5" stroke="#10b981" stroke-width="2" rx="5"/>
      <text x="100" y="20" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">10.59× Speedup!</text>
      <text x="100" y="38" font-size="11" text-anchor="middle" fill="#047857">Even better at longer sequences</text>
    </g>
  </g>
</svg>
