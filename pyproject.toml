[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-hybrid-simulator"
version = "0.2.0"
description = "Quantum-inspired hybrid simulator with tensor networks, analytic QFT sampling, AQED, and ML integration for research and education"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Quantum Hybrid Simulator Contributors"},
]
maintainers = [
    {name = "Quantum Hybrid Simulator Contributors"},
]
keywords = [
    "quantum",
    "simulation",
    "tensor-networks",
    "mps",
    "qft",
    "machine-learning",
    "aqed",
    "period-finding",
    "cryptography",
    "compression"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.22",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
# Machine learning components
ml = [
    "scikit-learn>=1.2",
    "torch>=2.0.0",
    "pandas>=1.5.0",
    "einops>=0.6.0",
]

# GPU acceleration (CUDA)
gpu = [
    "cupy-cuda12x>=12.0.0; platform_machine=='x86_64'",
    "triton>=2.0.0",
]

# Advanced GPU optimizations (optional, may not build on all platforms)
gpu_advanced = [
    "flash-attn>=2.0.0",
]

# Hugging Face integration
hf = [
    "transformers>=4.30.0",
    "datasets>=2.12.0",
]

# Development tools
dev = [
    "pytest>=7.3",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.2",
    "black>=23.0",
    "ruff>=0.0.260",
    "mypy>=1.2",
]

# Documentation generation
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.2",
    "sphinx-autodoc-typehints>=1.23",
    "myst-parser>=1.0",
]

# Notebook support
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.22",
    "ipywidgets>=8.0",
]

# All optional dependencies
all = [
    "quantum-hybrid-simulator[ml,gpu,gpu_advanced,hf,dev,docs,notebooks]",
]

[project.urls]
Homepage = "https://github.com/your-org/quantum-hybrid-simulator"
Documentation = "https://quantum-hybrid-simulator.readthedocs.io"
Repository = "https://github.com/your-org/quantum-hybrid-simulator"
"Bug Tracker" = "https://github.com/your-org/quantum-hybrid-simulator/issues"
Changelog = "https://github.com/your-org/quantum-hybrid-simulator/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["quantum_hybrid_system*"]

[tool.setuptools.package-data]
quantum_hybrid_system = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["Tests"]
markers = [
    "gpu: tests that exercise optional GPU paths (deselect with '-m \"not gpu\"')",
    "slow: longer-running tests (deselect with '-m \"not slow\"')",
    "ml: tests requiring PyTorch/ML dependencies",
    "integration: end-to-end integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["quantum_hybrid_system"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
